# Read by `h5i app`: extract, check, prove, mutate, doctor.

[extract]
crate = "kernel"
# Charon starts here and extracts what it reaches.
start-from = [
  "transition",
  "rules::exclusive",
  "rules::members_consistent",
  "rules::collision_safe",
  "rules::occupied",
  "rules::placement_ok",
  "rules::relocate",
  "rules::settle",
  "geom::grid_hit",
  "geom::grid_build",
  "geom::grid_wellformed",
  "geom::grid_yield",
  "step::agent_step",
  "step::tick_moves",
  "step::tick_players",
  "step::propose_one",
  "step::resolve_one",
  "step::tick_round",
  "step::tick_players_round",
  "step::scan_hit",
  "step::scan_yield",
  "rules::motion_isolated",
  "rules::paths_isolated",
  "rules::same_motion",
]
schema = true
# Extract the SQL codec with the kernel so Column and has_col are definitions,
# not axioms. The proof gate rejects any `axiom` declaration.
include = ["h5i_app_sql"]

[check]
theorems = [
  "ai_town_kernel.exclusive_preserved",
  "ai_town_kernel.members_consistent_preserved",
  "ai_town_kernel.collision_safe_preserved",
  "ai_town_kernel.motion_isolated_for_player",
  "ai_town_kernel.step_never_blocked",
  "ai_town_kernel.step_never_overlap",
  "ai_town_kernel.step_clear_moves",
  "ai_town_kernel.roster_set",
  "ai_town_kernel.tick_players_loop0_length",
  "ai_town_kernel.tick_players_loop1_roster",
  "ai_town_kernel.tick_players_keeps_roster",
  "ai_town_kernel.exclusive_of_members",
  "ai_town_kernel.findIdx?_ids",
  "ai_town_kernel.option_usize_ext",
  "ai_town_kernel.player_index_of_ids",
  "ai_town_kernel.own_player_of_ids",
  "ai_town_kernel.members_consistent_of_roster",
  "ai_town_kernel.tick_players_preserves_exclusive",
  "ai_town_kernel.tick_players_preserves_members",
  "ai_town_kernel.tick_players_preserves_own_player",
  "ai_town_kernel.propose_never_blocked",
  "ai_town_kernel.propose_stays_on_hit",
  "ai_town_kernel.propose_clear",
  "ai_town_kernel.resolve_stays",
  "ai_town_kernel.resolve_yields",
  "ai_town_kernel.resolve_accepts",
  "ai_town_kernel.absNat_comm",
  "ai_town_kernel.distAt_comm",
  "ai_town_kernel.distNat_distAt",
  "ai_town_kernel.within_radius_neighbor_tile",
  "ai_town_kernel.two_phase_apart",
  "ai_town_kernel.tick_players_round_loop0_length",
  "ai_town_kernel.tick_players_round_loop1_length",
  "ai_town_kernel.tick_players_round_loop2_roster",
  "ai_town_kernel.tick_players_round_keeps_roster",
  "ai_town_kernel.tick_players_round_preserves_exclusive",
  "ai_town_kernel.tick_players_round_preserves_members",
  "ai_town_kernel.tick_players_round_preserves_own_player",
  "ai_town_kernel.milli_val",
  "ai_town_kernel.mask_blocked_ok",
  "ai_town_kernel.mask_blocked_spec",
  "ai_town_kernel.occupied_spec",
  "ai_town_kernel.relocate_loop_ok",
  "ai_town_kernel.slot_close_spec",
  "ai_town_kernel.cell_slots_val",
  "ai_town_kernel.cell_close_spec",
  "ai_town_kernel.near_any_spec",
  "ai_town_kernel.nearB_spec",
  "ai_town_kernel.all_clear_spec",
  "ai_town_kernel.fill_set",
  "ai_town_kernel.u32_max_val",
  "ai_town_kernel.place_spec",
  "ai_town_kernel.bucket_loop_spec",
  "ai_town_kernel.place_max_dim_val",
  "ai_town_kernel.bucket_spec",
  "ai_town_kernel.placement_ok_sound",
  "ai_town_kernel.relocate_placed",
  "ai_town_kernel.settle_loop_spec",
  "ai_town_kernel.settle_spec",
  "ai_town_kernel.settle_placed",
]

# Each `old` occurs once. A proof that does not mention the real check lets the mutant through.
[[mutant]]
name = "second_conversation"
file = "kernel/src/rules.rs"
old = "if member_index(&s.members, id).is_some() || member_index(&s.members, invitee).is_some() {"
new = "if member_index(&s.members, id).is_some() && member_index(&s.members, invitee).is_some() {"

[[mutant]]
name = "move_anyone"
file = "kernel/src/rules.rs"
old = "Some(i) => Ok(s.players[i].id),"
new = "Some(_) => Ok(s.players[0].id),"

[[mutant]]
name = "overlap_allowed"
file = "kernel/src/rules.rs"
old = "if p.id != ignore && geom::dist_sq(p.x, p.y, x, y) < COLLISION_SQ {"
new = "if p.id != ignore && geom::dist_sq(p.x, p.y, x, y) > COLLISION_SQ {"

[[mutant]]
name = "one_member_ok"
file = "kernel/src/rules.rs"
old = "s.members.push(Member { conversation: cid, player: invitee, invited: now, status: ST_INVITED, started: 0 });"
new = "let _ = (cid, invitee, now);"

[[mutant]]
name = "relocate_unchecked"
file = "kernel/src/rules.rs"
old = "    if !placement_ok(&s) {"
new = "    if false && !placement_ok(&s) {"

[[mutant]]
name = "near_any_misses_a_tile"
file = "kernel/src/rules.rs"
old = "        || cell_close(s, slots, cx + 2, cy + 2, p.x, p.y, p.id)\n"
new = "\n"

[[mutant]]
name = "cell_skips_a_slot"
file = "kernel/src/rules.rs"
old = "        || slot_close(s, slots, b + 3, x, y, id)\n"
new = "\n"

[[mutant]]
name = "bucket_ignores_a_full_tile"
file = "kernel/src/rules.rs"
old = "            ok = place(&mut slots, b, i as u32);"
new = "            let _ = place(&mut slots, b, i as u32);"

[[mutant]]
name = "settle_keeps_any_movement"
file = "kernel/src/rules.rs"
old = "    if placement_ok(s) {\n        return false;"
new = "    if true || placement_ok(s) {\n        return false;"
