[package]
name = "ai-town-server"
description = "h5i-app shell for AI Town: HTTP, Postgres, sim loop, agent worker"
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"
publish = false

[dependencies]
ai-town-kernel = { path = "../kernel" }
axum = { version = "0.8", features = ["ws", "json"] }
h5i-app = { version = "=0.1.2", features = ["http", "postgres"] }
h5i-app-core = "=0.1.2"
h5i-app-pg = "=0.1.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
